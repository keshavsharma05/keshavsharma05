<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 720">
<style><![CDATA[
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400&display=swap');
:root{--bg:#0b0f14;--border:#30363d;--text:#f5f5f5;--muted:#b8b8b8;--green:#69d66d;}
.bg{fill:var(--bg);stroke:var(--border);stroke-width:2}
.sep{stroke:var(--border);stroke-width:2}
.mono{font-family:"JetBrains Mono",monospace}
.inter{font-family:Inter,Arial,sans-serif}
.small{font-size:24px;fill:var(--muted)}
.big{font-size:92px;font-weight:300;fill:var(--text)}
.green{fill:var(--green)}
.white{fill:var(--text)}
.dim{fill:var(--muted)}
#clip rect{animation:typing 2.8s steps(13,end) forwards}
#cursor{animation:blink 1s steps(1,end) infinite,move 2.8s steps(13,end) forwards}
@keyframes typing{from{width:0}to{width:670px}}
@keyframes move{from{transform:translateX(0)}to{transform:translateX(635px)}}
@keyframes blink{50%{opacity:0}}
]]></style>

<rect x="6" y="6" width="1588" height="708" rx="26" class="bg"/>
<line x1="6" y1="82" x2="1594" y2="82" class="sep"/>

<circle cx="36" cy="42" r="10" fill="#ff5f57"/>
<circle cx="66" cy="42" r="10" fill="#febc2e"/>
<circle cx="96" cy="42" r="10" fill="#28c840"/>

<text x="155" y="47" class="mono green" font-size="22">keshav@portfolio:~$</text>
<text x="430" y="47" class="mono white" font-size="22">whoami</text>

<text x="58" y="190" class="mono small">Hello, I'm</text>

<clipPath id="clip">
  <rect x="58" y="205" width="0" height="170"/>
</clipPath>

<text x="58" y="340" class="inter big" clip-path="url(#clip)">Keshav Sharma</text>

<rect id="cursor" x="100" y="254" width="4" height="94" fill="#d6d6d6"/>

<text x="58" y="425" class="mono" font-size="34">
<tspan class="green">Full Stack Developer</tspan><tspan class="dim"> building scalable</tspan>
</text>
<text x="58" y="474" class="mono dim" font-size="34">web applications and modern solutions.</text>

<g class="mono" font-size="22" fill="#ddd">
<text x="58" y="590">&lt;/&gt; MERN Stack</text>
<text x="300" y="590">⚡ Problem Solver</text>
<text x="565" y="590">&gt;_ Clean Code</text>
<text x="835" y="590">◈ Detail Oriented</text>
</g>

<line x1="1115" y1="145" x2="1115" y2="610" class="sep"/>

<g class="mono">
<text x="1175" y="190" class="dim" font-size="22">Location</text>
<text x="1175" y="225" class="white" font-size="24">Jaipur, India</text>
<line x1="1155" y1="245" x2="1545" y2="245" class="sep"/>

<text x="1175" y="315" class="dim" font-size="22">Email</text>
<text x="1175" y="350" class="white" font-size="22">your@email.com</text>
<line x1="1155" y1="370" x2="1545" y2="370" class="sep"/>

<text x="1175" y="440" class="dim" font-size="22">Portfolio</text>
<text x="1175" y="475" class="white" font-size="22">yourportfolio.dev</text>
</g>
</svg>
